    <path d="M155 160V350" stroke="url(#inner)" stroke-width="27" stroke-linecap="round"/>
    <path d="M155 160H245" stroke="url(#inner)" stroke-width="27" stroke-linecap="round"/>
    <path d="M155 255H224" stroke="url(#inner)" stroke-width="23" stroke-linecap="round"/>

    <path d="M275 185V350" stroke="url(#neon)" stroke-width="25" stroke-linecap="round"/>
    <path d="M275 185C275 185 300 158 337 180C370 199 357 240 357 240V350"
