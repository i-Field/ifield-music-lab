  <circle cx="275" cy="125" r="12" fill="#43E5FF"/>
  <circle cx="357" cy="150" r="7" fill="#A879FF"/>
  <path d="M112 390H400" stroke="url(#neon)" stroke-width="3" opacity=".5"/>
