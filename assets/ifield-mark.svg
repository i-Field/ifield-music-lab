
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="neon" x1="75" y1="70" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43E5FF"/>
      <stop offset=".52" stop-color="#548BFF"/>
      <stop offset="1" stop-color="#A879FF"/>
    </linearGradient>
    <linearGradient id="inner" x1="150" y1="130" x2="370" y2="390" gradientUnits="userSpaceOnUse">
